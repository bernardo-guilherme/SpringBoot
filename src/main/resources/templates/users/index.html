<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>キラークイーン 第三の爆弾 バイツ・ザ・ダスト</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="container pt-3 pl-3 pr-3 pb-3">
        <a th:href="@{/users/new}" type="button" class="btn btn-primary float-end">Novo Usuário</a>
        <h1>Lista Usuários (<span th:text="${size}">0</span>)</h1>
        <hr>
        <table class="table">
            <thead>
            <tr>
                <th scope="col">#</th>
                <th scope="col">First</th>
                <th scope="col">CPF</th>
                <th scope="col">Arroba</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${listUsers}">
                <th scope="row" th:text="${user.id}">1</th>
                <td th:text="${user.name}">Mark</td>
                <td th:text="${user.cpf}">Otto</td>
                <td th:text="${user.arroba}">@mdo</td>
            </tr>
            </tbody>
        </table>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
